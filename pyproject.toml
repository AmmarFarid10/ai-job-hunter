[project]
name = "ai-job-hunter"
version = "0.5.0"
description = "Human-approved job hunting backend — Phases 1–5"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2",
  "httpx>=0.28,<1", "langgraph>=1.0,<2", "python-docx>=1.2,<2", "apscheduler>=3.11,<4", "PyJWT[crypto]>=2.10,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.12"
strict = true
[[tool.mypy.overrides]]
module = ["pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
