services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: localdev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobhunter:localdev@db:5432/jobhunter
      STORAGE_DIR: /app/storage
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["resume_data:/app/storage"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  dashboard:
    build: ./dashboard
    environment:
      BACKEND_URL: http://backend:8000
      DASHBOARD_ORIGIN: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  test-db:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: job_hunter_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d job_hunter_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      API_KEY: test-key-at-least-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://test:test@test-db:5432/job_hunter_test
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@test-db:5432/job_hunter_test
      STORAGE_DIR: /tmp/job-hunter-test-storage
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", ".venv/bin/alembic upgrade head && .venv/bin/pytest -q"]
volumes:
  postgres_data:
  resume_data:
